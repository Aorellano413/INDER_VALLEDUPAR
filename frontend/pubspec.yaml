name: InderApp
description: "Aplicación de reservas de canchas deportivas"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.4.0
  carousel_slider: ^5.0.0
  fl_chart: ^0.69.0

  provider: ^6.1.2

  firebase_core: ^2.27.1
  firebase_auth: ^4.17.9
  cloud_firestore: ^4.15.9
  firebase_storage: ^11.7.0

  otp: ^3.2.0
  crypto: ^3.0.3
  qr_flutter: ^4.1.0

  path_provider: ^2.0.15
  image_picker: ^1.1.2
  intl: ^0.18.1
  url_launcher: ^6.1.10
  maps_launcher: ^3.0.0+1
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  mailer: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/images/logo.png"
  adaptive_icon_foreground: "lib/images/logo.png"
  adaptive_icon_background: "#FFFFFF"

flutter:
  uses-material-design: true

  assets:
    - lib/images/